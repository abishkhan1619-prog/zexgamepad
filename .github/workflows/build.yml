name: Build ZexGamePad APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Create project files
        run: |

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ZexGamePad"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOF

          mkdir -p app/src/main/java/com/example/mypad

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.mypad"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.mypad"
                  minSdk = 28
                  targetSdk = 34
                  versionCode = 2
                  versionName = "2.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature android:name="android.hardware.bluetooth" android:required="true"/>

              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30"/>
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30"/>
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>
              <uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE"/>

              <application
                  android:label="ZexGamePad"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/mypad/MainActivity.kt <<'EOF'
          package com.example.mypad

          import android.Manifest
          import android.annotation.SuppressLint
          import android.app.Activity
          import android.bluetooth.*
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.os.Bundle
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.widget.*

          @SuppressLint("MissingPermission")
          class MainActivity : Activity() {

              private var hid: BluetoothHidDevice? = null
              private var host: BluetoothDevice? = null
              private var adapter: BluetoothAdapter? = null

              private var buttons = 0
              private var up = false
              private var down = false
              private var left = false
              private var right = false

              private lateinit var status: TextView
              private lateinit var deviceBox: LinearLayout

              private val descriptor = intArrayOf(
                  0x05,0x01,0x09,0x05,0xA1,0x01,0x85,0x01,
                  0x05,0x09,0x19,0x01,0x29,0x10,0x15,0x00,
                  0x25,0x01,0x75,0x01,0x95,0x10,0x81,0x02,
                  0x05,0x01,0x09,0x39,0x15,0x01,0x25,0x08,
                  0x35,0x00,0x46,0x3B,0x01,0x65,0x14,
                  0x75,0x04,0x95,0x01,0x81,0x42,
                  0x65,0x00,0x75,0x04,0x95,0x01,0x81,0x03,
                  0x05,0x01,0x09,0x30,0x09,0x31,0x09,0x32,
                  0x09,0x35,0x15,0x81,0x25,0x7F,
                  0x35,0x00,0x45,0x00,0x75,0x08,0x95,0x04,
                  0x81,0x02,0xC0
              ).map { it.toByte() }.toByteArray()

              private val callback =
                  object : BluetoothHidDevice.Callback() {

                  override fun onAppStatusChanged(
                      pluggedDevice: BluetoothDevice?,
                      registered: Boolean
                  ) {
                      runOnUiThread {
                          if (registered) {
                              status.text = "HID READY - Search on your TV"
                              makeDiscoverable()
                              showPaired()
                          } else {
                              status.text = "HID registration failed"
                          }
                      }
                  }

                  override fun onConnectionStateChanged(
                      device: BluetoothDevice?,
                      state: Int
                  ) {
                      runOnUiThread {
                          when (state) {

                              BluetoothProfile.STATE_CONNECTING -> {
                                  status.text = "CONNECTING: ${device?.name}"
                              }

                              BluetoothProfile.STATE_CONNECTED -> {
                                  host = device
                                  status.text = "CONNECTED: ${device?.name}"
                                  send()
                              }

                              BluetoothProfile.STATE_DISCONNECTING -> {
                                  status.text = "DISCONNECTING..."
                              }

                              BluetoothProfile.STATE_DISCONNECTED -> {
                                  if (host == device) host = null
                                  status.text =
                                      "DISCONNECTED: ${device?.name ?: "Device"}"
                              }
                          }

                          showPaired()
                      }
                  }
              }

              private fun dp(v: Int) =
                  (v * resources.displayMetrics.density).toInt()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  adapter = (getSystemService(BLUETOOTH_SERVICE)
                      as BluetoothManager).adapter

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setBackgroundColor(Color.rgb(15,18,32))
                  root.setPadding(dp(16),dp(8),dp(16),dp(8))

                  val top = LinearLayout(this)
                  top.gravity = Gravity.CENTER_VERTICAL

                  status = TextView(this)
                  status.text = "Tap START to activate gamepad"
                  status.setTextColor(Color.WHITE)
                  status.textSize = 14f

                  top.addView(status,
                      LinearLayout.LayoutParams(0,-2,1f))

                  val startBtn = Button(this)
                  startBtn.text = "START"
                  startBtn.setOnClickListener { begin() }
                  top.addView(startBtn)

                  root.addView(top)

                  deviceBox = LinearLayout(this)
                  deviceBox.orientation = LinearLayout.HORIZONTAL
                  root.addView(deviceBox)

                  val row = LinearLayout(this)
                  row.gravity = Gravity.CENTER
                  row.orientation = LinearLayout.HORIZONTAL

                  val dpad = GridLayout(this)
                  dpad.columnCount = 3
                  dpad.rowCount = 3

                  addCell(dpad,pad("▲","#2c3354"){up=it;send()},0,1)
                  addCell(dpad,pad("◀","#2c3354"){left=it;send()},1,0)
                  addCell(dpad,pad("▶","#2c3354"){right=it;send()},1,2)
                  addCell(dpad,pad("▼","#2c3354"){down=it;send()},2,1)

                  row.addView(dpad)

                  row.addView(View(this),
                      LinearLayout.LayoutParams(0,1,1f))

                  val mid = LinearLayout(this)
                  mid.orientation = LinearLayout.VERTICAL

                  val shoulders = LinearLayout(this)
                  shoulders.addView(wide("L1",4))
                  shoulders.addView(wide("R1",5))

                  val menu = LinearLayout(this)
                  menu.addView(wide("SELECT",6))
                  menu.addView(wide("START",7))

                  mid.addView(shoulders)
                  mid.addView(menu)
                  row.addView(mid)

                  row.addView(View(this),
                      LinearLayout.LayoutParams(0,1,1f))

                  val face = GridLayout(this)
                  face.columnCount = 3
                  face.rowCount = 3

                  addCell(face,bit("Y","#4ade80",3),0,1)
                  addCell(face,bit("X","#6c8cff",2),1,0)
                  addCell(face,bit("B","#ffd166",1),1,2)
                  addCell(face,bit("A","#ff5d73",0),2,1)

                  row.addView(face)

                  root.addView(row,
                      LinearLayout.LayoutParams(-1,0,1f))

                  setContentView(root)
              }

              private fun addCell(
                  g: GridLayout,
                  v: View,
                  r: Int,
                  c: Int
              ) {
                  val lp = GridLayout.LayoutParams(
                      GridLayout.spec(r),
                      GridLayout.spec(c)
                  )
                  lp.width = dp(58)
                  lp.height = dp(58)
                  lp.setMargins(dp(3),dp(3),dp(3),dp(3))
                  g.addView(v,lp)
              }

              private fun pad(
                  label: String,
                  color: String,
                  onChange: (Boolean)->Unit
              ): Button {
                  val b = Button(this)
                  b.text = label
                  b.setTextColor(Color.WHITE)

                  val bg = GradientDrawable()
                  bg.setColor(Color.parseColor(color))
                  bg.cornerRadius = dp(15).toFloat()
                  b.background = bg

                  b.setOnTouchListener { v,e ->
                      when(e.actionMasked) {
                          MotionEvent.ACTION_DOWN -> {
                              v.alpha = 0.6f
                              onChange(true)
                          }
                          MotionEvent.ACTION_UP,
                          MotionEvent.ACTION_CANCEL -> {
                              v.alpha = 1f
                              onChange(false)
                          }
                      }
                      true
                  }
                  return b
              }

              private fun bit(
                  label:String,
                  color:String,
                  n:Int
              ) = pad(label,color) { setBit(n,it) }

              private fun wide(label:String,n:Int):Button {
                  val b = pad(label,"#2c3354") { setBit(n,it) }
                  b.layoutParams =
                      LinearLayout.LayoutParams(dp(80),dp(46)).also {
                          it.setMargins(dp(4),dp(4),dp(4),dp(4))
                      }
                  return b
              }

              private fun setBit(n:Int,on:Boolean) {
                  buttons = if(on)
                      buttons or (1 shl n)
                  else
                      buttons and (1 shl n).inv()

                  send()
              }

              private fun send() {
                  val h = hid ?: return
                  val d = host ?: return

                  if(h.getConnectionState(d) !=
                      BluetoothProfile.STATE_CONNECTED) return

                  val hat = when {
                      up && right -> 2
                      right && down -> 4
                      down && left -> 6
                      left && up -> 8
                      up -> 1
                      right -> 3
                      down -> 5
                      left -> 7
                      else -> 0
                  }

                  val report = byteArrayOf(
                      (buttons and 255).toByte(),
                      ((buttons shr 8) and 255).toByte(),
                      hat.toByte(),0,0,0,0
                  )

                  val ok = h.sendReport(d,1,report)

                  if(!ok) {
                      status.text = "Input report failed"
                  }
              }

              private fun begin() {

                  if(adapter == null || adapter?.isEnabled != true) {
                      status.text = "Turn Bluetooth ON"
                      return
                  }

                  if(Build.VERSION.SDK_INT >= 31) {
                      val permissions = arrayOf(
                          Manifest.permission.BLUETOOTH_CONNECT,
                          Manifest.permission.BLUETOOTH_ADVERTISE
                      )

                      val missing = permissions.filter {
                          checkSelfPermission(it) !=
                              PackageManager.PERMISSION_GRANTED
                      }

                      if(missing.isNotEmpty()) {
                          requestPermissions(
                              missing.toTypedArray(),100
                          )
                          return
                      }
                  }

                  startHid()
              }

              override fun onRequestPermissionsResult(
                  requestCode:Int,
                  permissions:Array<out String>,
                  grantResults:IntArray
              ) {
                  super.onRequestPermissionsResult(
                      requestCode,permissions,grantResults
                  )

                  if(requestCode == 100 &&
                      grantResults.isNotEmpty() &&
                      grantResults.all {
                          it == PackageManager.PERMISSION_GRANTED
                      }) {
                      startHid()
                  } else if(requestCode == 100) {
                      status.text = "Bluetooth permissions denied"
                  }
              }

              private fun startHid() {
                  val a = adapter ?: return

                  status.text = "Opening Bluetooth HID..."

                  val opened = a.getProfileProxy(
                      this,
                      object : BluetoothProfile.ServiceListener {

                          override fun onServiceConnected(
                              profile:Int,
                              proxy:BluetoothProfile
                          ) {
                              if(profile != BluetoothProfile.HID_DEVICE) {
                                  status.text = "HID profile unavailable"
                                  return
                              }

                              val h = proxy as BluetoothHidDevice
                              hid = h

                              status.text = "Registering Gamepad..."

                              val sdp =
                                  BluetoothHidDeviceAppSdpSettings(
                                      "ZexGamePad",
                                      "Wireless Game Controller",
                                      "ZexGamePad",
                                      BluetoothHidDevice.SUBCLASS2_GAMEPAD,
                                      descriptor
                                  )

                              val registered = h.registerApp(
                                  sdp,
                                  null,
                                  null,
                                  mainExecutor,
                                  callback
                              )

                              if(!registered) {
                                  status.text =
                                      "HID registration request failed"
                              }
                          }

                          override fun onServiceDisconnected(
                              profile:Int
                          ) {
                              hid = null
                              host = null
                              status.text = "HID service disconnected"
                          }
                      },
                      BluetoothProfile.HID_DEVICE
                  )

                  if(!opened) {
                      status.text = "Cannot open HID profile. Phone may not support HID Device."
                  }
              }

              private fun makeDiscoverable() {
                  try {
                      val intent = Intent(
                          BluetoothAdapter.ACTION_REQUEST_DISCOVERABLE
                      )
                      intent.putExtra(
                          BluetoothAdapter.EXTRA_DISCOVERABLE_DURATION,
                          300
                      )
                      startActivity(intent)
                  } catch(e:Exception) {
                      status.text = "Discoverability failed: ${e.message}"
                  }
              }

              private fun showPaired() {
                  deviceBox.removeAllViews()

                  val list = try {
                      adapter?.bondedDevices
                  } catch(e:SecurityException) {
                      status.text = "Bluetooth permission missing"
                      return
                  } ?: return

                  val h = hid ?: return

                  for(d in list) {
                      val b = Button(this)

                      val state = h.getConnectionState(d)

                      b.text = when(state) {
                          BluetoothProfile.STATE_CONNECTED ->
                              "CONNECTED: ${d.name}"
                          BluetoothProfile.STATE_CONNECTING ->
                              "CONNECTING: ${d.name}"
                          else ->
                              "CONNECT: ${d.name}"
                      }

                      b.textSize = 11f

                      b.setOnClickListener {

                          val current = h.getConnectionState(d)

                          if(current ==
                              BluetoothProfile.STATE_CONNECTED) {
                              status.text = "Already connected"
                              return@setOnClickListener
                          }

                          status.text = "Requesting HID connection.
